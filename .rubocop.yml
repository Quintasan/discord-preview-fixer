plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-sequel

inherit_mode:
  merge:
    - Include

AllCops:
  NewCops: enable
  Include:
    - 'Steepfile'

Style/HashSyntax:
  EnforcedShorthandSyntax: consistent

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Style/Documentation:
  Enabled: false
